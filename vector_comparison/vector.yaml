data_dir: /var/lib/vector

api:
  enabled: true
  address: 127.0.0.1:8686

sources:
  kafka_logs:
    type: kafka
    bootstrap_servers: "localhost:9092"
    group_id: "vector-bench"
    topics:
      - raw-logs
    auto_offset_reset: "earliest"
    decoding:
      codec: bytes

transforms:
  auth_to_ecs:
    type: remap
    inputs:
      - kafka_logs
    source: |
      # ---- keep the raw line ----
      .event.original = to_string(.message)""
      .ecs.version = "8.11.0"
      .event.dataset = "linux.auth"
      .event.module = "system"

      # ---- split "TIMESTAMP HOST PROC[PID]: MSG" ----
      base, base_err = parse_regex(.event.original, r'^(?P<ts>\S+)\s+(?P<host>\S+)\s+(?P<proc>\([^)]*\)|[A-Za-z0-9_\.\-]+)(\[(?P<pid>\d+)\])?:\s?(?P<msg>.*)$')

      msg = to_string(.event.original) ?? ""

      if base_err == null {
        ts_str = to_string(base.ts)
        host_str = to_string(base.host)
        proc_str = to_string(base.proc)
        pid_str = to_string(base.pid)
        msg_str = to_string(base.msg)

        parsed_ts, terr = parse_timestamp(ts_str, format: "%+")
        if terr == null {
          .@timestamp = parsed_ts
        }

        .host.name = host_str
        .process.name = strip_whitespace(replace(proc_str, r'[\(\)]', ""))

        if pid_str != "" {
          pid_int, pid_err = to_int(pid_str)
          if pid_err == null {
            .process.pid = pid_int
          }
        }

        .message = msg_str
        msg = msg_str
      } else {
        .message = msg
      }

      # ---- default classification ----
      .event.kind = "event"
      .event.category = ["process"]
      .event.type = ["info"]
      .event.outcome = "unknown"

      # ---- SSH: accepted password ----
      m, e = parse_regex(msg, r'^Accepted password for (?P<user>\S+) from (?P<ip>\S+) port (?P<port>\d+)')
      if e == null {
        user_str = to_string(m.user)
        ip_str = to_string(m.ip)
        port_str = to_string(m.port)

        .event.category = ["authentication"]
        .event.type = ["start"]
        .event.action = "ssh_login"
        .event.outcome = "success"
        .user.name = user_str
        .source.ip = ip_str
        port_int, pe = to_int(port_str)
        if pe == null { .source.port = port_int }
      }

      # ---- SSH: failed password (valid or invalid user) ----
      m, e = parse_regex(msg, r'^Failed password for (invalid user )?(?P<user>\S+) from (?P<ip>\S+) port (?P<port>\d+)')
      if e == null {
        user_str = to_string(m.user)
        ip_str = to_string(m.ip)
        port_str = to_string(m.port)

        .event.category = ["authentication"]
        .event.type = ["start"]
        .event.action = "ssh_login"
        .event.outcome = "failure"
        .user.name = user_str
        .source.ip = ip_str
        port_int, pe = to_int(port_str)
        if pe == null { .source.port = port_int }
      }

      # ---- SSH: generic PAM authentication failure ----
      m, e = parse_regex(msg, r'authentication failure;.*rhost=(?P<ip>\S+)\s*(\s+user=(?P<user>\S+))?')
      if e == null {
        ip_str = to_string(m.ip)
        user_str = to_string(m.user)

        .event.category = ["authentication"]
        .event.type = ["start"]
        .event.action = "ssh_login"
        .event.outcome = "failure"
        .source.ip = ip_str
        if user_str != "" { .user.name = user_str }
      }

      # ---- SSH: invalid user attempt ----
      m, e = parse_regex(msg, r'^Invalid user (?P<user>\S+) from (?P<ip>\S+) port (?P<port>\d+)')
      if e == null {
        user_str = to_string(m.user)
        ip_str = to_string(m.ip)
        port_str = to_string(m.port)

        .event.category = ["authentication"]
        .event.type = ["start"]
        .event.action = "ssh_invalid_user"
        .event.outcome = "failure"
        .user.name = user_str
        .source.ip = ip_str
        port_int, pe = to_int(port_str)
        if pe == null { .source.port = port_int }
      }

      # ---- SSH: connection closed (preauth) ----
      m, e = parse_regex(msg, r'^Connection closed by (invalid user |authenticating user )?(?P<user>\S+) (?P<ip>\S+) port (?P<port>\d+)')
      if e == null {
        user_str = to_string(m.user)
        ip_str = to_string(m.ip)
        port_str = to_string(m.port)

        .event.category = ["authentication"]
        .event.type = ["end"]
        .event.action = "ssh_connection_closed"
        .event.outcome = "failure"
        .user.name = user_str
        .source.ip = ip_str
        port_int, pe = to_int(port_str)
        if pe == null { .source.port = port_int }
      }

      # ---- SSH: disconnect received ----
      m, e = parse_regex(msg, r'^Received disconnect from (?P<ip>\S+) port (?P<port>\d+)')
      if e == null {
        ip_str = to_string(m.ip)
        port_str = to_string(m.port)

        .event.category = ["authentication"]
        .event.type = ["end"]
        .event.action = "ssh_disconnect_received"
        .event.outcome = "success"
        .source.ip = ip_str
        port_int, pe = to_int(port_str)
        if pe == null { .source.port = port_int }
      }

      # ---- SSH: disconnected ----
      m, e = parse_regex(msg, r'^Disconnected from user (?P<user>\S+) (?P<ip>\S+) port (?P<port>\d+)')
      if e == null {
        user_str = to_string(m.user)
        ip_str = to_string(m.ip)
        port_str = to_string(m.port)

        .event.category = ["authentication"]
        .event.type = ["end"]
        .event.action = "ssh_disconnected"
        .event.outcome = "success"
        .user.name = user_str
        .source.ip = ip_str
        port_int, pe = to_int(port_str)
        if pe == null { .source.port = port_int }
      }

      # ---- PAM: session opened ----
      m, e = parse_regex(msg, r'session opened for user (?P<user>[^\(]+)\(uid=\d+\) by (?P<by_user>[^\(]+)\(uid=\d+\)')
      if e == null {
        user_str = strip_whitespace(to_string(m.user))
        by_user_str = strip_whitespace(to_string(m.by_user))

        .event.category = ["session", "authentication"]
        .event.type = ["start"]
        .event.action = "session_opened"
        .event.outcome = "success"
        .user.name = user_str
        .related.user = [user_str, by_user_str]
      }

      # ---- PAM: session closed ----
      m, e = parse_regex(msg, r'session closed for user (?P<user>\S+)')
      if e == null {
        user_str = to_string(m.user)

        .event.category = ["session", "authentication"]
        .event.type = ["end"]
        .event.action = "session_closed"
        .event.outcome = "success"
        .user.name = user_str
      }

      # ---- systemd-logind: new session ----
      m, e = parse_regex(msg, r'^New session \d+ of user (?P<user>\S+)\.')
      if e == null {
        user_str = to_string(m.user)

        .event.category = ["session"]
        .event.type = ["start"]
        .event.action = "logind_new_session"
        .event.outcome = "success"
        .user.name = user_str
      }

      # ---- systemd-logind: session logged out / removed ----
      m, e = parse_regex(msg, r'^Session \d+ logged out')
      if e == null {
        .event.category = ["session"]
        .event.type = ["end"]
        .event.action = "logind_session_logged_out"
        .event.outcome = "success"
      }

      m, e = parse_regex(msg, r'^Removed session \d+')
      if e == null {
        .event.category = ["session"]
        .event.type = ["end"]
        .event.action = "logind_session_removed"
        .event.outcome = "success"
      }

      # ---- sudo: command execution ----
      m, e = parse_regex(msg, r'^(?P<user>\S+)\s*:\s*TTY=(?P<tty>\S+)\s*;\s*PWD=(?P<pwd>\S+)\s*;\s*USER=(?P<target_user>\S+)\s*;\s*COMMAND=(?P<command>.*)$')
      if e == null {
        user_str = to_string(m.user)
        target_str = to_string(m.target_user)
        pwd_str = to_string(m.pwd)
        cmd_str = to_string(m.command)

        .event.category = ["process", "authentication"]
        .event.type = ["start"]
        .event.action = "sudo_command"
        .event.outcome = "success"
        .user.name = user_str
        .user.target.name = target_str
        .process.working_directory = pwd_str
        .process.command_line = cmd_str
      }

      # ---- sudo: pam session opened for root ----
      m, e = parse_regex(msg, r'^pam_unix\(sudo:session\): session opened for user (?P<target_user>[^\(]+)\(uid=\d+\) by (?P<user>[^\(]+)\(uid=\d+\)')
      if e == null {
        user_str = strip_whitespace(to_string(m.user))
        target_str = strip_whitespace(to_string(m.target_user))

        .event.category = ["session", "authentication"]
        .event.type = ["start"]
        .event.action = "sudo_session_opened"
        .event.outcome = "success"
        .user.name = user_str
        .user.target.name = target_str
      }

      # ---- su: switch user ----
      m, e = parse_regex(msg, r'^\(to (?P<target_user>\S+)\) (?P<user>\S+) on (?P<tty>\S+)')
      if e == null {
        user_str = to_string(m.user)
        target_str = to_string(m.target_user)

        .event.category = ["process", "authentication"]
        .event.type = ["change"]
        .event.action = "su"
        .event.outcome = "success"
        .user.name = user_str
        .user.target.name = target_str
      }

      # ---- cron ----
      proc_name = to_string(.process.name) ?? ""
      if starts_with(proc_name, "CRON") {
        .event.category = ["process"]
        .event.dataset = "linux.cron"
        if contains(msg, "session opened") {
          .event.type = ["start"]
          .event.action = "cron_session_opened"
        } else if contains(msg, "session closed") {
          .event.type = ["end"]
          .event.action = "cron_session_closed"
        }
        .event.outcome = "success"
      }

      # ---- final cleanup ----
      action = to_string(.event.action) ?? ""
      if action == "" {
        .event.action = "unclassified"
      }

sinks:
  blackhole:
    type: blackhole
    inputs:
      - auth_to_ecs
    print_interval_secs: 1
